# Every issue starts from a form: docs/planning.md sorts an issue by the
# sections its template asks for, and a blank one has none of them.
blank_issues_enabled: false
contact_links:
  - name: Read the documentation
    url: https://grishan0v.github.io/echolot/
    about: Collecting, analysing and comparing traces, what each detector catches, and how the agent uses them.
  - name: Ask a question
    url: https://github.com/grishan0v/echolot/discussions/categories/q-a
    about: How to do something, or why a report says what it says.
  - name: Share an early idea
    url: https://github.com/grishan0v/echolot/discussions/categories/ideas
    about: An idea that is not ready to be an issue yet. Once it is concrete, it becomes one.
  - name: Report a vulnerability
    url: https://github.com/grishan0v/echolot/security/advisories/new
    about: Privately, through the Security tab. Please do not open a public issue.
