name: publish

# Publishes to PyPI on a version tag:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# Authentication is PyPI Trusted Publishing (OIDC): no token lives in the
# repository. PyPI must know this workflow — see docs/publishing.md.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The tag is the release; pyproject.toml is what ends up on PyPI. If they
      # disagree the upload would carry the wrong version — fail here instead.
      - name: Check that the tag matches pyproject.toml
        run: |
          v="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject.toml version $v"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The environment name is part of the trust: PyPI's publisher config for
    # this project names it, and only a run in this environment gets a token.
    environment:
      name: pypi
      url: https://pypi.org/project/echolot/
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
