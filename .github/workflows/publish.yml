name: publish

# A version tag is the release:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# Three jobs, in order: build the sdist and wheel; upload them to PyPI; create
# the GitHub Release for the tag with the same two files attached and the
# notes generated from the commits since the previous tag.
#
# PyPI authentication is Trusted Publishing (OIDC): no token lives in the
# repository. PyPI must know this workflow — see docs/publishing.md.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The tag is the release; pyproject.toml is what ends up on PyPI. If they
      # disagree the upload would carry the wrong version — fail here instead.
      - name: Check that the tag matches pyproject.toml
        run: |
          v="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject.toml version $v"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The environment name is part of the trust: PyPI's publisher config for
    # this project names it, and only a run in this environment gets a token.
    environment:
      name: pypi
      url: https://pypi.org/project/echolot/
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  # Runs only after PyPI has the files, so a GitHub Release never exists for a
  # version that failed to publish. The attached wheel and sdist are the same
  # artifact PyPI received, byte for byte.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the release and upload its assets
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "echolot ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes "PyPI: https://pypi.org/project/echolot/${GITHUB_REF_NAME#v}/" \
            dist/*
