name: checks

# Every pull request into main, and main itself after a merge.
#
# `protect-main` gates merging on review. Review does not run the detectors,
# and this project's claim is that they compute the same answer everywhere —
# so the claim has to be checked somewhere other than the author's laptop.
#
# The publish workflow also builds and runs `twine check`, but only on a
# version tag, which is far too late: a tag is irreversible and a PyPI version
# number can never be reused. The `package` job below moves that check to
# where it can still stop something.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A second push to the same PR makes the first run pointless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selfchecks:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      # Every version is worth a separate answer: one of them failing must not
      # hide whether the others pass.
      fail-fast: false
      matrix:
        # The range pyproject.toml claims in its classifiers. Claiming it
        # without running it is how the claim goes stale.
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # trace_processor is ~40 MB, fetched on first use and verified against a
      # SHA-256 pinned by the perfetto package. Keyed on pyproject.toml because
      # that is where the pin lives: change the pin, get a different binary.
      - name: Cache trace_processor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/perfetto/prebuilts
          key: tp-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      # One step, because there is one suite. It used to be four: a doctor run
      # and three scripts, each with its own runner, its own output format and
      # its own idea of what a failure looks like.
      #
      # `doctor` is in there as a test of its own — the command's exit code is
      # what CI and the agent layer both route on — and so is every check it
      # runs, one pytest test each, so a failure names the claim rather than a
      # count.
      - name: pytest
        run: pytest -q

  # One context for the whole matrix, so the branch rule does not name Python
  # versions. Required checks are matched by context name: with the matrix
  # reported directly, a pull request that drops 3.10 would wait forever for a
  # `python 3.10` that is never coming, and the rule would have to be edited
  # before the change that needs it could merge.
  #
  # `if: always()` is what makes this a gate rather than decoration. Without
  # it the job is skipped when the matrix fails, and a skipped check is not a
  # failed one — the rule would pass on a red build.
  checks:
    name: checks
    runs-on: ubuntu-latest
    needs: [selfchecks]
    if: always()
    steps:
      - name: Every Python version passed
        # `result` on a matrix job is the aggregate: success only when every
        # leg succeeded. Anything else — failure, cancelled, skipped — is not
        # a pass and must not read as one.
        run: |
          echo "selfchecks: ${{ needs.selfchecks.result }}"
          [ "${{ needs.selfchecks.result }}" = "success" ] || exit 1

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # The badge in the README states a range; the classifiers state the list
      # the matrix above is built from. One claim kept in two places, and the
      # short badge is only worth having if something keeps them equal: a
      # version added to the matrix and forgotten in the README leaves the
      # front page quietly wrong while every other check stays green.
      - name: Check that the README badge matches the classifiers
        run: |
          python - <<'PY'
          import re, tomllib

          PREFIX = "Programming Language :: Python :: "
          classifiers = tomllib.load(open("pyproject.toml", "rb"))["project"]["classifiers"]
          versions = sorted(
              tuple(int(n) for n in c[len(PREFIX):].split("."))
              for c in classifiers
              if c.startswith(PREFIX) and c[len(PREFIX):].count(".") == 1
          )
          if not versions:
              raise SystemExit("pyproject.toml declares no Python X.Y classifiers")

          # `--` in a shields path renders as one hyphen, so that is the form
          # the badge URL carries and the form compared here.
          want = "%d.%d--%d.%d" % (*versions[0], *versions[-1])

          readme = open("README.md", encoding="utf-8").read()
          found = re.search(r"img\.shields\.io/badge/(\d+\.\d+--\d+\.\d+)-blue\?logo=python", readme)
          if not found:
              raise SystemExit("README.md has no Python version badge in the expected shape")
          if found.group(1) != want:
              raise SystemExit(
                  f"README badge says {found.group(1).replace('--', '-')}, "
                  f"classifiers say {want.replace('--', '-')}"
              )
          print(f"README badge and classifiers agree: {want.replace('--', '-')}")
          PY

      # What the README will actually be on PyPI. readme_renderer is the
      # renderer PyPI runs, and its Markdown support is an extra that neither
      # twine nor readme_renderer itself depends on — without `[md]` installed
      # the render is not merely unchecked, it is impossible.
      #
      # The interesting failure is the quiet one. The sanitiser works from an
      # allow-list and it edits in place: an address it rejects is removed and
      # the tag stays, so `<img alt="License">` reaches the page as an empty
      # box while every count still matches. Counting tags proves nothing.
      # The addresses themselves are what has to come out the other side.
      - name: Check that the README renders on PyPI
        run: |
          python -m pip install --upgrade 'readme_renderer[md]'
          python - <<'PY'
          import re

          source = open("README.md", encoding="utf-8").read()

          from readme_renderer.markdown import render
          html = render(source)
          if html is None:
              raise SystemExit("README.md does not render on PyPI at all")

          SRC = r'<img[^>]*\ssrc="([^"]+)"'
          wanted = dict.fromkeys(re.findall(SRC, source))
          arrived = set(re.findall(SRC, html))

          # `&` comes out as `&amp;`, which is encoding rather than loss.
          lost = [u for u in wanted
                  if u not in arrived and u.replace("&", "&amp;") not in arrived]
          if lost:
              raise SystemExit(
                  "the sanitiser removed these image addresses; they would be "
                  "empty boxes on PyPI:\n  " + "\n  ".join(lost)
              )
          print(f"README renders; all {len(wanted)} image addresses survive")
          PY

      # The rule the comment below gives as its reason, enforced rather than
      # stated. A relative link renders perfectly well — the step above will
      # not object to one — and resolves against pypi.org, where the file it
      # names does not exist. That is how the licence badge spent four
      # releases pointing at nothing.
      #
      # README.md only. docs/*.md link to each other relatively and should:
      # they are read on GitHub, they are never shipped to PyPI, and rewriting
      # them as absolute URLs would pin every link to one branch name.
      - name: Check that the README has no relative links
        run: |
          python - <<'PY'
          import re

          readme = open("README.md", encoding="utf-8").read()
          links = re.findall(r'href="([^"]+)"', readme) + re.findall(r'\]\(([^)]+)\)', readme)

          # An in-page anchor survives the trip: readme_renderer rewrites
          # `#status` to `#user-content-status` and the heading id to match.
          relative = sorted({u for u in links
                             if not u.startswith(("https://", "http://", "#", "mailto:"))})
          if relative:
              raise SystemExit(
                  "these links resolve against pypi.org and would go nowhere; "
                  "use the full GitHub URL:\n  " + "\n  ".join(relative)
              )
          print(f"README has no relative links ({len(links)} checked)")
          PY

      # `twine check` validates the packaging metadata, and for a Markdown
      # README that is all it does: its `_RENDERERS` table maps `text/markdown`
      # to None with the comment "Rendering cannot fail", so it never opens
      # README.md. The step above is the render this comment used to claim.
      #
      # Both run here rather than only at tag time. Relative links do not
      # resolve on PyPI, which is why the README uses full GitHub URLs, and a
      # check that waited for the tag would report it after the version was
      # already published.
      - name: Build and check the artefacts
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
