version: 2

# A pinned SHA is a frozen SHA, and freezing on its own trades one risk for
# another. Nothing can retag an action out from under a build any more; nothing
# tells you when the action you froze has since been fixed. `release/v1` on the
# publish action existed precisely so security updates arrived on their own, and
# pinning it takes that away. This is the half that gives it back.
#
# One pull request per update, carrying the new SHA and the release notes, which
# is the point of pinning: the change becomes something to look at rather than
# something that happened.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # The one place where a pull request per update is the wrong shape.
      # `init` and `analyse` are two entry points into a single repository, and
      # the first writes a settings file that the second reads back. Both have
      # to be the same version. Dependabot counts them as two dependencies and
      # opens two pull requests, each raising one entry point and leaving the
      # other behind, and each of those fails its own checks by construction:
      # the analyse step refuses a settings file written by a version other
      # than its own. Grouping them makes the pair move together, which is the
      # only way it can move.
      codeql-action:
        patterns:
          - "github/codeql-action*"

# Deliberately not the pip ecosystem. perfetto is pinned with `==` because the
# package carries the trace_processor binary and its SHA-256, and a different
# binary means different trace semantics with the SQL unchanged — pyproject.toml
# says so at length. Raising that pin is a decision with a self-check attached,
# and a bot opening it weekly would be arguing with the policy rather than
# serving it.
