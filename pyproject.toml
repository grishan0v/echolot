[build-system]
# >=77 for the SPDX `license = "..."` form (PEP 639); older setuptools would
# reject the key as a plain string.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "echolot"
# Read from echolot/__init__.py. Written in one place, because the version is
# also reported by `doctor`, stamped into runs.jsonl and into the layer
# manifest — and importlib.metadata answers from whatever dist-info exists,
# which on an editable install is whatever was written the first time.
dynamic = ["version"]
description = "Turns a huge Android trace into 20 rows of facts an AI agent can actually use"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Andrey Grishanov", email = "grishanov.dev@gmail.com" }]
keywords = ["perfetto", "android", "performance", "tracing", "profiling", "ai-agents", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]

dependencies = [
    # The version is pinned exactly, and that is a necessity rather than hygiene.
    #
    # The perfetto package carries a manifest with a pinned trace_processor_shell
    # version (0.57.2 → TP v56.1) and a SHA-256 per architecture. And
    # trace_processor is not a utility you feed SQL to — it is a vocabulary: the
    # strings 'Running', 'R' and 'binder transaction async' that the detectors
    # match on are invented by it, not by the kernel and not by the app. A
    # different TP version means different trace semantics with the SQL
    # unchanged to the character.
    #
    # The manifest is rolled by a separate release tool with its own numbering;
    # there is no contract that a patch release of the package keeps the same
    # binary. So '~=' would not pin the thing the pin exists for — only '=='.
    #
    # Raising the version is fine and expected, but deliberately: raise the pin,
    # run `echolot doctor`, and look at what the self-check says.
    "perfetto==0.57.2",

    # No pin needed here: PyYAML reads the config and does not affect trace
    # semantics.
    "PyYAML>=6.0",

    # Colour in `--help` and in the usage line argparse prints before an error.
    # It touches nothing a detector computes, and Rich falls back to plain text
    # on its own when stdout is not a terminal — which is how an agent, a pipe
    # and CI all see it.
    #
    # Worth saying out loud what one line here installs: rich-argparse pulls in
    # rich, and rich pulls in pygments, markdown-it-py and mdurl. Four
    # distributions for help text, against the two this package had, all four
    # MIT or BSD-2. What they cost at run time is not nothing: `import
    # echolot.main` imports no rich yet, but every command builds the parser
    # before it runs, and building it formats the usage through rich-argparse.
    # After `echolot status`, 43 `rich.*` modules are loaded — some 30 ms of
    # the first parse on a laptop. pygments and markdown-it are not imported,
    # by `status` or by `--help`.
    #
    # The cap is on the major version, not the minor: the formatter class names
    # and `group_name_formatter` are the API this uses, and 1.x keeps them.
    "rich-argparse>=1.7,<2",
]

# Development only. Nothing here reaches a wheel, and nothing here can change
# what a detector computes — `doctor` still runs its checks with the package's
# own dependencies and no pytest anywhere near it, because it runs on a user's
# laptop.
#
# hypothesis generates inputs for the pure parsers/formatters (table, when,
# config, anr, reflect.facts) — it never runs inside echolot/ itself, and the
# seed is pinned in tests/conftest.py so a random failure there is still a
# repeatable one in CI.
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=7", "ruff>=0.14", "hypothesis>=6.100"]
# The documentation site (.github/workflows/docs.yml): the generator and the
# extension that renders GitHub's callouts, pinned, since zensical is at 0.0.x
# and moves between releases. Nothing here reaches `pip install echolot`.
docs = ["zensical==0.0.67", "markdown-callouts==0.4.0"]

# What a linter is here for, and what it is not.
#
# codeql already reads this code, and reads it for a different thing: shapes
# known to be exploitable. It has no opinion on an import nobody uses, and
# that is the class this catches — a name left behind by a refactor, a
# variable assigned and never read, an f-string with nothing in it, a `zip`
# that silently stops at the shorter side.
#
# Ruff's own defaults (E4, E7, E9, F) plus bugbear and the whitespace rules.
# Deliberately NOT E501: the comments here carry the reasoning, and a column
# limit would be an argument with every one of them. Long lines are a matter
# of taste and are left to it; a name that does not exist is not.
[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A DeprecationWarning attributed to echolot's own code fails the test that
# raised it: that is the standard library, or a dependency, saying a call this
# package makes is on its way out — how a future Python announces a breakage,
# and the only cheap moment to hear it is now. Only those: any other warning,
# and a deprecation inside a dependency's own code, is reported the way pytest
# always reports it, in the summary at the end.
filterwarnings = ["error::DeprecationWarning:echolot.*"]

[tool.coverage.run]
source = ["echolot"]
# Several tests run the CLI as a child process — `python -m echolot.main`, the
# way a person and an agent run it — and without this nothing those runs
# reached was counted, unless some in-process test happened to reach it too.
# coverage >= 7.10, which pytest-cov 7 already requires, measures the
# children and folds them into the total.
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
# Measured 2026-09-28 with `pytest --cov=echolot`, child processes counted
# (`patch` above): 91.82%, 756 of 9239 statements missed. Without them the
# same tree reads 90.19%. The gate sits a point and a bit below the first
# number — enough that an unrelated line here or there doesn't fail CI on one
# of the five Python versions, not so much that coverage can drift downward
# release after release without anyone noticing.
fail_under = 90.5

[tool.setuptools.dynamic]
version = { attr = "echolot.__version__" }

[project.urls]
Homepage = "https://github.com/grishan0v/echolot"
Documentation = "https://github.com/grishan0v/echolot/tree/main/docs"
Repository = "https://github.com/grishan0v/echolot"
Issues = "https://github.com/grishan0v/echolot/issues"

[project.scripts]
echolot = "echolot.main:main"

# Namespace discovery rather than an explicit list: echolot/sql and
# echolot/claude have no __init__.py, and setuptools' rule for such
# data-only directories under an explicitly listed package is deprecated —
# a newer setuptools in CI could drop them from the wheel without a word.
# With `find` + namespaces (the default) they are found on purpose.
[tool.setuptools.packages.find]
include = ["echolot*"]

# Without this the installed package has no detectors: SQL_DIR points at
# echolot/sql next to __file__, and a wheel ships only .py by default.
[tool.setuptools.package-data]
echolot = [
    "sql/*.sql",
    "sql/detectors/*.sql",
    # The .claude/ layer — the template `echolot init` installs into a project.
    "claude/*.json",
    "claude/*/*.md",
    "claude/*/*/*.md",
    "claude/*/*/*/*.md",
    # Printed by `echolot guide`: the same knowledge, for clients that have no
    # skill mechanism to install it into.
    "guide/*.md",
]
