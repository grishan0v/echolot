[build-system]
# >=77 for the SPDX `license = "..."` form (PEP 639); older setuptools would
# reject the key as a plain string.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "echolot"
version = "0.3.0"
description = "A deterministic layer between Perfetto traces and AI agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Andrey Grishanov", email = "grishanov.dev@gmail.com" }]
keywords = ["perfetto", "android", "performance", "tracing", "profiling", "ai-agents", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]

dependencies = [
    # The version is pinned exactly, and that is a necessity rather than hygiene.
    #
    # The perfetto package carries a manifest with a pinned trace_processor_shell
    # version (0.57.2 → TP v56.1) and a SHA-256 per architecture. And
    # trace_processor is not a utility you feed SQL to — it is a vocabulary: the
    # strings 'Running', 'R' and 'binder transaction async' that the detectors
    # match on are invented by it, not by the kernel and not by the app. A
    # different TP version means different trace semantics with the SQL
    # unchanged to the character.
    #
    # The manifest is rolled by a separate release tool with its own numbering;
    # there is no contract that a patch release of the package keeps the same
    # binary. So '~=' would not pin the thing the pin exists for — only '=='.
    #
    # Raising the version is fine and expected, but deliberately: raise the pin,
    # run `echolot doctor`, and look at what the self-check says.
    "perfetto==0.57.2",

    # No pin needed here: PyYAML reads the config and does not affect trace
    # semantics.
    "PyYAML>=6.0",
]

# Development only. Nothing here reaches a wheel, and nothing here can change
# what a detector computes — `doctor` still runs its checks with the package's
# own dependencies and no pytest anywhere near it, because it runs on a user's
# laptop.
[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every warning the package emits, at the top of the report. A DeprecationWarning
# from the standard library is how a future Python announces a breakage, and the
# only cheap moment to hear it is now.
filterwarnings = ["error::DeprecationWarning:echolot.*"]

[project.urls]
Homepage = "https://github.com/grishan0v/echolot"
Documentation = "https://github.com/grishan0v/echolot/tree/main/docs"
Repository = "https://github.com/grishan0v/echolot"
Issues = "https://github.com/grishan0v/echolot/issues"

[project.scripts]
echolot = "echolot.main:main"

# Namespace discovery rather than an explicit list: echolot/sql and
# echolot/claude have no __init__.py, and setuptools' rule for such
# data-only directories under an explicitly listed package is deprecated —
# a newer setuptools in CI could drop them from the wheel without a word.
# With `find` + namespaces (the default) they are found on purpose.
[tool.setuptools.packages.find]
include = ["echolot*"]

# Without this the installed package has no detectors: SQL_DIR points at
# echolot/sql next to __file__, and a wheel ships only .py by default.
[tool.setuptools.package-data]
echolot = [
    "sql/*.sql",
    "sql/detectors/*.sql",
    # The .claude/ layer — the template `echolot init` installs into a project.
    "claude/*.json",
    "claude/*/*.md",
    "claude/*/*/*.md",
    "claude/*/*/*/*.md",
    # Printed by `echolot guide`: the same knowledge, for clients that have no
    # skill mechanism to install it into.
    "guide/*.md",
]
