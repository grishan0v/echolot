<svg xmlns="http://www.w3.org/2000/svg" width="880" height="616" viewBox="0 0 880 616" role="img" aria-label="echolot does the legwork, your agent decides"><title>echolot does the legwork, your agent decides</title><text x="40" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1F2328" text-anchor="start" xml:space="preserve" style="white-space:pre">echolot does the legwork, your agent decides</text><rect x="40" y="75" width="22" height="14" rx="3" fill="#2F5F73"/><text x="70" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#59636E" text-anchor="start" xml:space="preserve" style="white-space:pre">echolot runs it, the same way every time</text><rect x="370.75" y="75.75" width="20.5" height="12.5" rx="3" fill="none" stroke="#1F2328" stroke-width="1.5"/><text x="400" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#59636E" text-anchor="start" xml:space="preserve" style="white-space:pre">the agent decides</text><rect x="550.75" y="75.75" width="20.5" height="12.5" rx="3" fill="none" stroke="#59636E" stroke-width="1.5" stroke-dasharray="4 3"/><text x="580" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#59636E" text-anchor="start" xml:space="preserve" style="white-space:pre">you</text><path d="M280 172 L311 172" fill="none" stroke="#59636E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M320 172L310 178L310 166Z" fill="#59636E"/><path d="M560 172 L591 172" fill="none" stroke="#59636E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M600 172L590 178L590 166Z" fill="#59636E"/><path d="M720 224 L720 295" fill="none" stroke="#59636E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M720 304L714 294L726 294Z" fill="#59636E"/><path d="M600 356 L569 356" fill="none" stroke="#59636E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M560 356L570 350L570 362Z" fill="#59636E"/><path d="M320 356 L289 356" fill="none" stroke="#59636E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M280 356L290 350L290 362Z" fill="#59636E"/><path d="M440 408 L440 479" fill="none" stroke="#59636E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M440 488L434 478L446 478Z" fill="#59636E"/><path d="M160 304 L160 264 L440 264 L440 233" fill="none" stroke="#59636E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M440 224L446 234L434 234Z" fill="#59636E"/><text x="176.0" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#59636E" text-anchor="start" xml:space="preserve" style="white-space:pre">next round · up to 3 by default</text><text x="300" y="346.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#59636E" text-anchor="middle" xml:space="preserve" style="white-space:pre">no</text><text x="452.0" y="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#59636E" text-anchor="start" xml:space="preserve" style="white-space:pre">yes</text><rect x="40.75" y="120.75" width="238.5" height="102.5" rx="10" fill="none" stroke="#59636E" stroke-width="1.5" stroke-dasharray="5 4"/><text x="58" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2328" text-anchor="start" xml:space="preserve" style="white-space:pre">You</text><text x="58" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#59636E" text-anchor="start" xml:space="preserve" style="white-space:pre">say what regressed</text><text x="58" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#59636E" text-anchor="start" xml:space="preserve" style="white-space:pre">and after which change</text><rect x="320" y="120" width="240" height="104" rx="10" fill="#2F5F73"/><text x="338" y="154" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start" xml:space="preserve" style="white-space:pre">collect</text><text x="338" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="start" xml:space="preserve" style="white-space:pre">records the scenario 5 times</text><text x="338" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="start" xml:space="preserve" style="white-space:pre">gradle mode: its own count</text><rect x="600" y="120" width="240" height="104" rx="10" fill="#2F5F73"/><text x="618" y="154" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start" xml:space="preserve" style="white-space:pre">analyze</text><text x="618" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="start" xml:space="preserve" style="white-space:pre">runs the 13 detectors</text><text x="618" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="start" xml:space="preserve" style="white-space:pre">writes about 20 rows</text><rect x="600" y="304" width="240" height="104" rx="10" fill="#2F5F73"/><text x="618" y="338" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start" xml:space="preserve" style="white-space:pre">compare</text><text x="618" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="start" xml:space="preserve" style="white-space:pre">from round 2: what moved</text><text x="618" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="start" xml:space="preserve" style="white-space:pre">and whether the move holds</text><rect x="320.75" y="304.75" width="238.5" height="102.5" rx="10" fill="none" stroke="#1F2328" stroke-width="1.5"/><text x="338" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2328" text-anchor="start" xml:space="preserve" style="white-space:pre">The agent</text><text x="338" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#59636E" text-anchor="start" xml:space="preserve" style="white-space:pre">reads the rows:</text><text x="338" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#59636E" text-anchor="start" xml:space="preserve" style="white-space:pre">a place in the code?</text><rect x="40.75" y="304.75" width="238.5" height="102.5" rx="10" fill="none" stroke="#1F2328" stroke-width="1.5"/><text x="58" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2328" text-anchor="start" xml:space="preserve" style="white-space:pre">The agent</text><text x="58" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#59636E" text-anchor="start" xml:space="preserve" style="white-space:pre">marks one blind spot</text><text x="58" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#59636E" text-anchor="start" xml:space="preserve" style="white-space:pre">with 5–7 temporary markers</text><rect x="320.75" y="488.75" width="238.5" height="102.5" rx="10" fill="#F6F8FA" stroke="#1F2328" stroke-width="2"/><text x="338" y="522" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2328" text-anchor="start" xml:space="preserve" style="white-space:pre">The answer</text><text x="338" y="548" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#59636E" text-anchor="start" xml:space="preserve" style="white-space:pre">place, evidence, mechanism,</text><text x="338" y="570" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#59636E" text-anchor="start" xml:space="preserve" style="white-space:pre">confidence; markers removed</text><text x="40" y="520" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start" xml:space="preserve" style="white-space:pre">echolot mark --apply</text><text x="40" y="542" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#59636E" text-anchor="start" xml:space="preserve" style="white-space:pre">places the markers when the</text><text x="40" y="562" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#59636E" text-anchor="start" xml:space="preserve" style="white-space:pre">project has none of its own</text></svg>
