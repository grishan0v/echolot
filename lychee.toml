# Configuration for the `lychee` link checker (.github/workflows/linkcheck.yml).
#
# Scope is README.md, SECURITY.md and docs/**/*.md — the same paths the
# workflow triggers on and passes on its command line. No other Markdown in
# the repository is written for a reader outside it.

# A CI runner is not a browser with a person waiting on it: give a slow or
# momentarily rate-limited server room to answer before calling it dead.
timeout = 20
max_retries = 3
retry_wait_time = 2

# Anchors as well as pages. A link like `../README.md#some-heading` resolves as
# long as the file exists, and the heading can be renamed under it:
# docs/compare.md pointed at a README heading that was gone for weeks, and
# every run passed. This checks each `#anchor` against the headings of the
# Markdown file it points into, which is the whole of what this repository
# links to that way.
#
# A string rather than `true`: lychee v0.24.2, the version lychee-action v2.9.0
# installs, reads the key as none, anchor-only, text-only or full, and a
# boolean does not parse — the whole run would stop at the config. And no
# absolute GitHub link to a Markdown file may carry an anchor: lychee cannot
# see the headings of a file GitHub renders in the browser, and says so in its
# own source, which is one more reason the README links to documents rather
# than into them.
include_fragments = "anchor-only"

# `checks.yml` already fails the build on a relative link in README.md — see
# its "Check that the README has no relative links" step — so link rot in an
# absolute URL, and an anchor no heading answers any more, are the failures
# left for this checker to catch.
exclude = [
  # shields.io renders the README's badges (build status is served straight
  # off github.com and is excluded separately below). Each SVG is generated
  # per request from live data — PyPI's current version, this repo's licence
  # — and GitHub Actions runners share IP ranges shields.io rate-limits under
  # load. A 429 here is about shared traffic, not a broken link.
  '^https://img\.shields\.io/',

  # The two workflow-status badges: `badge.svg?branch=main` is regenerated
  # from whatever the latest run on that branch happens to be, not a fixed
  # asset. There is no "broken" for this checker to find here, only today's
  # colour.
  '^https://github\.com/grishan0v/echolot/actions/workflows/[^/]+/badge\.svg',

  # PyPI's account pages — the project's publishing settings and the API
  # token form, both linked from docs/publishing.md. They need a logged-in
  # session, so an anonymous checker can never verify them: the most it can
  # get is a redirect to the login form. And they have answered automated
  # clients with 503 now and then since PyPI's incident of 2026-09-23,
  # "Issues with search, logins and logged-in pages" — every run on the pull
  # requests of 2026-09-28 failed on exactly these two links, while
  # https://pypi.org/project/echolot/ answered 200. The public pages stay
  # checked; only the ones behind a login are left out.
  '^https://pypi\.org/manage/',

  # The README's own pictures, under docs/assets/. The README names them by
  # their full address on `main` because PyPI resolves nothing relative, and a
  # picture added in a pull request is not on `main` until that pull request
  # merges: checked here, the one that adds it would fail on its own picture.
  # tests/test_readme_pictures.py checks the same addresses against the tree
  # the pull request brings.
  '^https://raw\.githubusercontent\.com/grishan0v/echolot/main/docs/assets/',
]
